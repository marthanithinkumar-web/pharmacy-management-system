name: MedCare keep awake

on:
  schedule:
    # Render Free sleeps after 15 minutes without traffic.
    # Scheduled Actions can be delayed, so this is a best-effort workaround.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-awake.yml"

permissions:
  contents: read

concurrency:
  group: medcare-keep-awake
  cancel-in-progress: true

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping lightweight health endpoint
        env:
          HEALTH_URL: https://medcare-pharmacy.onrender.com/health
        run: |
          set -eu
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            "$HEALTH_URL"
